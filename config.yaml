llm:
  base_url: "http://localhost:1234/v1"
  # Devstral is a coding model — it is not tuned for prose summarisation.
  # Recommended swap once downloaded in LM Studio (MLX build, ~20 GB on disk):
  #   model: "qwen/qwen3.6-35b-a3b"
  model: "mistralai/devstral-small-2-2512"
  temperature: 0.3
  max_tokens_summary: 300
  max_tokens_digest: 800
  max_tokens_classify: 60
  # Re-check every generated summary against the article text and throw it
  # away if it asserts anything the source doesn't support. Doubles the number
  # of LLM calls but stops invented news reaching the site.
  verify_summaries: true

feeds:
  - label: "BBC News"
    url: "https://feeds.bbci.co.uk/news/rss.xml"
  - label: "The Guardian"
    url: "https://www.theguardian.com/world/rss"
  - label: "Al Jazeera"
    url: "https://www.aljazeera.com/xml/rss/all.xml"
  - label: "The Register"
    url: "https://www.theregister.com/headlines.atom"
  - label: "The Register – Security"
    url: "https://www.theregister.com/security/headlines.atom"
  - label: "Engadget"
    url: "https://www.engadget.com/rss.xml"
  - label: "MacRumours"
    url: "https://feeds.macrumors.com/MacRumors-All"
  - label: "Hacker News"
    url: "https://hnrss.org/frontpage"
  - label: "IGN"
    url: "https://feeds.feedburner.com/ign/all"
  - label: "XKCD"
    url: "https://xkcd.com/rss.xml"
  - label: "Reddit – LocalLLaMA"
    url: "https://www.reddit.com/r/LocalLLaMA/.rss"
  - label: "Reddit – ComfyUI"
    url: "https://www.reddit.com/r/comfyui/.rss"
  - label: "Reddit – openclaw"
    url: "https://www.reddit.com/r/openclaw/.rss"
  - label: "Reddit – All"
    url: "https://www.reddit.com/r/all/.rss"
  - label: "UK Politics"
    url: "https://www.reddit.com/r/ukpolitics/.rss"

settings:
  retention_days: 3
  # Minimum characters of real article text required before we ask the LLM for
  # a summary at all. Below this we quote the source instead of generating.
  min_source_chars: 400
  # Pre-rendered OGG narration (kokoro + ffmpeg). Slow, rarely used — off.
  audio_enabled: false
  # Entries kept per feed per fetch. This is a hard cap: anything beyond it in
  # a feed's list is dropped and never backfilled, so it must comfortably exceed
  # what a feed publishes between runs. Fast feeds are the risk — Al Jazeera
  # runs ~5 items/hour, so 12 covers only ~2.4h of a 6h gap.
  items_per_feed: 12
  # Drop feed entries older than this. Guards against a feed freezing and
  # serving a stale cache as if it were current (openrss.org/reuters.com
  # sat ~4 weeks stale while still returning HTTP 200 + valid RSS).
  # Deliberately NOT retention_days: slow feeds (XKCD, Register Security)
  # legitimately carry items older than 3 days.
  max_item_age_days: 14
  # Max items summarised per run. Steady state is ~60 new items per 6h run,
  # so this needs headroom to drain a backlog rather than dumping the
  # remainder into the Uncategorised pile. ~1.25 min/item on the local LLM.
  max_summaries_per_run: 200
  # Same shape as the summary cap. get_unclassified orders newest-first, so
  # a cap below intake starves an older backlog rather than just delaying it
  # (71 items from 25 Aug sat unclassified through four runs at limit=80).
  # Keep this comfortably above per-run intake (~54-88 items).
  max_classified_per_run: 200
  # Characters of extracted article text sent to the LLM per summary. Caps
  # prompt size and cost; the groundedness check reads from the same text.
  max_article_chars: 6000
  site_title: "Newsfeed"
  tts_voice: "af_sky"
  audio_speed: 1.0
  timezone: "Europe/London"
